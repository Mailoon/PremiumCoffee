server.port=${PORT:8080}
spring.application.name=PremiumCoffe

logging.structured.format.console=${LOG_FORMAT:}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}

media.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
media.cloudinary.folder=${CLOUDINARY_FOLDER:premiumcoffee}

media.local.enabled=${MEDIA_LOCAL_ENABLED:false}
media.local.root=${MEDIA_LOCAL_ROOT:./media}
media.local.public-path=${MEDIA_LOCAL_PUBLIC_PATH:/media}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

auth.rate-limit.enabled=true
auth.rate-limit.trust-forwarded-for=true
auth.rate-limit.auth-attempts=5
auth.rate-limit.auth-window=60s
auth.rate-limit.write-attempts=30
auth.rate-limit.write-window=60s