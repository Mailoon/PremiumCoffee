server.port=${PORT:8080}
spring.application.name=PremiumCoffe

# Spring Boot >= 3.4: con structured.format.console=ecs sale un objeto JSON
# por linea con los campos que AWS CloudWatch y Azure Log Analytics ya saben
# indexar y filtrar. Vacio (el valor por defecto) es texto plano y se deja
# asi en local, donde el JSON solo estorba.
logging.structured.format.console=${LOG_FORMAT:}

# Cierre ordenado: al recibir el senal de parada Spring deja de aceptar
# peticiones nuevas y espera a que terminen las que ya estan en vuelo.
# Sin esto, un rolling deploy puede cortar un upload de GLB a media por la mitad.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Tope de conexiones POR CONTENEDOR. Al escalar, el total real contra la
# base de datos es este numero multiplicado por el numero de replicas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Las migraciones las aplica el servicio "migrate" de Docker/docker-compose.yml,
# no el backend. Asi con varias replicas arrancando a la vez nunca se pelean
# por el lock del esquema. En la nube esto es un Job/Task, no el servicio web.
spring.flyway.enabled=${FLYWAY_ENABLED:true}

media.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
media.cloudinary.folder=${CLOUDINARY_FOLDER:premiumcoffee}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# --- Actuator -------------------------------------------------------------
# /actuator/health es lo que consultan el healthcheck de compose, el balanceador
# de AWS y las probes de Azure y Kubernetes. Si no responde, el orquestador
# reinicia el contenedor y por eso tiene que existir.
#
# probes.enabled genera ademas /actuator/health/liveness y /actuator/health/readiness:
#   liveness  -> "estas vivo?" (si falla, el orquestador te mata y reinicia)
#   readiness -> "puedes recibir trafico?" (si falla, te quitan del balanceador
#                sin matarte, ideal justo mientras esperas a la base de datos)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# Nunca detalles internos hacia fuera: los "details"_filter van a cloudwatch.
management.endpoint.health.show-details=never
management.info.env.enabled=false