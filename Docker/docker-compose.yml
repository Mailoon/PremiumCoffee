# ==========================================================================
# PremiumCoffe — orquestacion local
#
#   docker compose up --build              -> levanta migrate + backend
#   docker compose up --build -d           -> en segundo plano
#   docker compose logs -f backend         -> ver el arranque
#   docker compose config                  -> ver el .env ya interpretado
#
# Si algo falla con "variable is not set", el .env esta mal o le falta algo.
# Ver la nota sobre .env al final de este archivo.
# ==========================================================================

name: premiumcoffe

services:
  frontend:
    build:
      context: ..
      dockerfile: Docker/frontend.Dockerfile
    image: premiumcoffe/frontend:local
    container_name: premiumcoffe-frontend
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # La URL del backend NO se define aqui: Nuxt ya usa "http://backend:8080"
      # por defecto (runtimeConfig.apiBase en nuxt.config.ts). Ese default es
      # el nombre del servicio dentro de la red de Docker Compose, y por eso
      # el frontend puede encontrar al backend sin conocer la IP.
      #
      # EN PRODUCCION hay que anadir esta linea de vuelta, apuntando al
      # backend por su URL interna real de la nube (no publica):
      #
      #   NUXT_API_BASE: ${API_INTERNAL_URL}
      #
      # Se lee en TIEMPO DE EJECUCION, no al compilar, y por eso la misma
      # imagen sirve para dev, staging y produccion sin reconstruir.
      #
      # runtimeConfig.public.siteUrl: esta si viaja al navegador.
      NUXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # caddy — reverse proxy con TLS. Solo con el perfil "tls":
  #     docker compose --profile tls up
  #
  # Existe para ENSAYAR en local lo que pasa en produccion: un solo origen
  # y HTTPS. Por eso NO viene en el `up` normal, que debe ser rapido.
  # En produccion se cambia "localhost" por el dominio real y Caddy pide el
  # certificado a Let's Encrypt solo, sin cron ni certbot.
  # ------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: premiumcoffe-caddy
    profiles: ["tls"]
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTP_PORT:-8081}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # migrate — tarea de un solo uso. Aplica las migraciones y se apaga.
  #
  # Por que NO deixar que Flyway corra dentro del backend:
  # con un contenedor no se nota, pero al escalar a varias replicas todas
  # arrancan a la vez, todas ven el esquema desactualizado y todas intentan
  # migrar. Solo una gana el lock y las demas revientan el deploy.
  #
  # Este patron es el mismo en la nube:
  #   AWS   -> ECS Task / Step Functions
  #   Azure -> Container Apps Job
  #   GCP   -> Cloud Run Job
  # ------------------------------------------------------------------------
  migrate:
    image: flyway/flyway:11
    container_name: premiumcoffe-migrate
    restart: "no"
    command: ["migrate"]
    volumes:
      - ../Backend/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      FLYWAY_URL: ${DB_URL:?DB_URL no esta definido. Copia Docker/.env.example a Docker/.env y rellenalo}
      FLYWAY_USER: ${DB_USER:?DB_USER no esta definido en Docker/.env}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido en Docker/.env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # Reintenta 30 veces: la red o el pooler pueden tardar en responder
      FLYWAY_CONNECT_RETRIES: "30"
      # Las migraciones ya aplicadas no se tocan jamas (regla de Flyway)
      FLYWAY_VALIDATE_ON_MIGRATE: "true"

  # ------------------------------------------------------------------------
  # backend — API Spring Boot
  # ------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: Docker/backend.Dockerfile
    image: premiumcoffe/backend:local
    container_name: premiumcoffe-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: true
    environment:
      # --- Base de datos (Supabase pooler) ---
      DB_URL: ${DB_URL:?DB_URL no esta definido en Docker/.env}
      DB_USER: ${DB_USER:?DB_USER no esta definido en Docker/.env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido en Docker/.env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      # --- Cloudinary ---
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-premiumcoffee}

      # --- Runtime ---
      PORT: "8080"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10MB}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 40s
    restart: unless-stopped

# ==========================================================================
# Volumenes de Caddy (solo se usan con el perfil "tls")
# Guardan el certificado TLS generado para que no se regenere en cada
# `up`, que es lo que hace que el arranque con TLS sea lento la primera vez.
# --------------------------------------------------------------------------
volumes:
  caddy_data:
  caddy_config:
# ==========================================================================