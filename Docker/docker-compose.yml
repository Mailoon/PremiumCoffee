# ==========================================================================
# NOTA SOBRE EL .env — lee esto antes de depurar un fallo raro
# --------------------------------------------------------------------------
# Compose lee el archivo .env que este en el MISMO DIRECTORIO que este
# docker-compose.yml, es decir Docker/.env. No mira el de la raiz del repo
# ni el de Backend/.
#
# Por eso el .env esta en Docker/ y por eso se borro el de Backend/.
#
# Lo que se hace con el archivo, paso a paso:
#
#   1. Compose lee Docker/.env en el HOST, antes de construir nada.
#   2. Sustituye los ${DB_URL}, ${DB_USER}, etc. de este archivo.
#   3. Docker CONSTRUYE la imagen usando el .dockerignore de la raiz del repo.
#
# El paso 3 es separado del paso 1. Por eso .env sigue estando en el
# .dockerignore y NO rompe nada: lo unico que hace es impedir que tus
# credenciales de Supabase y Cloudinary queden selladas dentro de una capa
# de la imagen, donde si seria imposible borrarlas.
#
# Las sintaxis ${VAR:?mensaje} que ves arriba hacen que compose se detenga
# con un mensaje claro si falta una variable. Sin ellas, compose la
# sustituye por cadena vacia y el backend arranca para fallar mucho mas
# tarde y con un error mucho mas dificil de leer.
# ==========================================================================